services:
  postgres:
    image: postgres:18.6
    container_name: fitness-ops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: fitness_ops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitness_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: